 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Bansal College Transport</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Admin Login Modal/Overlay -->
    <div id="adminLoginOverlay" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #2c3e50;">
        <div style="background: white; padding: 30px; border-radius: 8px; width: 350px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            <h2 style="margin-top: 0; color: #333;">Admin Login</h2>
            <p style="color: #666; font-size: 14px;">Enter password to access transport panel</p>
            <form id="adminLoginForm">
                <input type="password" id="adminPassword" placeholder="Enter admin password" required style="width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                <button type="submit" style="width: 100%; padding: 10px; background: #004085; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold;">Login</button>
            </form>
            <p id="adminLoginError" style="color: red; display: none; margin-top: 12px; font-size: 14px;"></p>
            <br>
            <a href="index.html" style="color: #666; text-decoration: none; font-size: 14px;">&larr; Back to Student Website</a>
        </div>
    </div>

    <!-- Admin Main Dashboard -->
    <div id="adminMainContent" style="display: none; padding: 20px; max-width: 900px; margin: 0 auto; color: #333;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px;">
            <h1>Admin Transport Portal</h1>
            <button id="adminLogoutButton" style="padding: 8px 16px; background: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer;">Logout</button>
        </div>

        <!-- Add/Edit Bus Form -->
        <div style="background: #f9f9f9; padding: 20px; margin: 20px 0; border-radius: 6px; border: 1px solid #ddd;">
            <h3 id="formTitle" style="margin-top: 0;">Add New Bus Route</h3>
            <form id="busForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                    <input type="text" id="busNo" placeholder="Bus Number (e.g. Bus 45)" required style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <input type="text" id="busPlate" placeholder="Plate No (e.g. MP 09 AB 1234)" required style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <input type="text" id="driverName" placeholder="Driver Name" required style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <input type="text" id="driverContact" placeholder="Driver Contact No" required style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <input type="text" id="busDest" placeholder="Destination (default: Bansal College Campus)" style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                <textarea id="busStops" placeholder="Stops (Comma separated, e.g. Vijay Nagar, Radisson, College)" required style="width: 100%; padding: 8px; height: 60px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"></textarea>
                
                <button type="submit" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Save Bus Route</button>
                <button type="button" id="cancelEdit" style="display: none; padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px;">Cancel</button>
            </form>
        </div>

        <!-- Bus List -->
        <h2>All Bus Routes</h2>
        <div id="adminBusList"></div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
